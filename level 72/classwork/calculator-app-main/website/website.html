<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
</head>
<body>
    <div id="maindiv">
        <div id="div1">
            <h1>calc</h1>
        </div>
        <div id="div2">
            <h1 style="margin-right: 25px;"><--calculations here</h1>
        </div>
        <div id="div3">
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button style="background-color: hsl(224, 28%, 35%);color: white;">DEL</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>+</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>-</button>

            <button>.</button>
            <button>0</button>
            <button>/</button>
            <button>X</button>
        </div>
        <div id="div4">
                <button style="background-color: hsl(225, 21%, 49%); width: 228px ;height: 60px;color: white;">RESET</button>
            <button style="background-color: hsl(6, 63%, 50%); width: 228px; height: 60px;color: white;">=</button>
        </div>
    </div>
</body>
</html>
