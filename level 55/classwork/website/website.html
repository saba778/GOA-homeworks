<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="biggestdiv">
        <div id="smalldiv1">
            <h3 id="unop">Your Result</h3>
            <div id="smalldiv2">
                <h1 style="margin-bottom: 0px;font-size: 50px;">76</h1>
                <p style="margin-top: 0px;font-size: smaller;">of 100</p>
            </div>
            <div id="unoptimised">
                <h1 style="margin-bottom: 7px;">Great</h1>
                <p style="margin-top: 0;font-size: 14px;text-align: center;">You scored higher than 65% of<br> the people who have taken<br> these tests.</p>
            </div>
        </div>
        <div id="smalldiv3">
            <div id="smalldiv4">
                <h3 style="margin-top: 30px;">Summary</h3>
                <div id="div1">
                    <img src="icon-reaction.svg"style="height: 24px;">
                    <p style="margin-left: 10px;font-size: small;">Reaction</p>
                    <h2 style="font-size: 15px;"> 80 / 100</h2>
                </div>
                <div id="div2">
                    <img src="icon-memory.svg" style="height: 24px;">
                    <p style="margin-left: 10px;font-size: small;">Memory</p>
                    <h2 style="font-size: 15px;"> 92 / 100</h2>
                </div>
                <div id="div3">
                    <img src="icon-verbal.svg"style="height: 24px;">
                    <p style="margin-left: 10px;font-size: small;">Verbal</p>
                    <h2 style="font-size: 15px;"> 61 / 100</h2>
                </div>
                <div id="div5">
                    <img src="icon-visual.svg"style="height: 24px;">
                    <p style="margin-left: 10px;font-size: small;">Visual</p>
                    <h2 style="font-size: 15px;"> 72 / 100</h2>
                </div>
                <button style="width: 240px; height: 50px;border-radius: 30%;background-color: hsl(224, 30%, 27%);margin-top: 20px;">
                    <h3 style="color: white;">Continue</h3>
                </button>
            </div>
        </div>
    </div>
</body>
</html>
